<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Animuotas RM ženklas</title>
  <desc id="description">Roko M. inicialai su subtiliu skaitmeniniu glitch efektu.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14" />
      <stop offset="0.58" stop-color="#111729" />
      <stop offset="1" stop-color="#08121b" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8ba2be" stroke-opacity="0.08" />
    </pattern>
    <clipPath id="topSlice">
      <rect x="0" y="78" width="1200" height="62" />
    </clipPath>
    <clipPath id="bottomSlice">
      <rect x="0" y="198" width="1200" height="54" />
    </clipPath>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>

  <style>
    .echo-cyan { animation: echo-cyan 4.8s steps(1, end) infinite; }
    .echo-gold { animation: echo-gold 4.8s steps(1, end) infinite; }
    .signal { animation: signal 4.8s ease-in-out infinite; }
    .scan { animation: scan 7s linear infinite; }

    @keyframes echo-cyan {
      0%, 89%, 100% { transform: translate(0); opacity: .74; }
      90% { transform: translate(-13px, 2px); opacity: 1; }
      92% { transform: translate(7px, -1px); opacity: .9; }
      94% { transform: translate(-3px, 0); opacity: .76; }
    }

    @keyframes echo-gold {
      0%, 89%, 100% { transform: translate(0); opacity: .78; }
      90% { transform: translate(11px, -2px); opacity: 1; }
      92% { transform: translate(-6px, 1px); opacity: .9; }
      94% { transform: translate(2px, 0); opacity: .8; }
    }

    @keyframes signal {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }

    @keyframes scan {
      from { transform: translateY(-20px); }
      to { transform: translateY(380px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .echo-cyan, .echo-gold, .signal, .scan { animation: none; }
    }
  </style>

  <rect width="1200" height="360" rx="24" fill="url(#background)" />
  <rect width="1200" height="360" rx="24" fill="url(#grid)" />

  <circle cx="164" cy="180" r="92" fill="#61e7db" opacity="0.07" filter="url(#softGlow)" />
  <circle cx="1036" cy="180" r="92" fill="#ffb545" opacity="0.08" filter="url(#softGlow)" />

  <g aria-hidden="true" font-family="Arial Black, Arial, sans-serif" font-size="190" font-weight="900" letter-spacing="-18">
    <text x="600" y="228" text-anchor="middle" fill="#61e7db" opacity="0.74" clip-path="url(#topSlice)" class="echo-cyan">RM</text>
    <text x="600" y="228" text-anchor="middle" fill="#ffb545" opacity="0.78" clip-path="url(#bottomSlice)" class="echo-gold">RM</text>
    <text x="600" y="228" text-anchor="middle" fill="#f5f7fb">RM</text>
  </g>

  <g aria-hidden="true">
    <path d="M164 180H350" stroke="#61e7db" stroke-width="2" stroke-linecap="round" />
    <circle cx="164" cy="180" r="5" fill="#61e7db" class="signal" />
    <path d="M850 180H1036" stroke="#ffb545" stroke-width="2" stroke-linecap="round" />
    <circle cx="1036" cy="180" r="5" fill="#ffb545" class="signal" />
    <rect x="28" y="0" width="1144" height="1" fill="#ffffff" opacity="0.07" class="scan" />
  </g>

  <text
    x="600"
    y="302"
    text-anchor="middle"
    fill="#aeb8c8"
    font-family="Consolas, Monaco, monospace"
    font-size="16"
    letter-spacing="5"
  >ROKAS M.  /  KURIU INTERNETO PROJEKTUS</text>
</svg>
